<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <caption>Billy &copy;</caption>
    <table border="true">
        <thead>
            <tr>
                <th>№</th>
                <th>Name</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Bill Gates</td>
                <td>Founder</td>
                <td rowspan="3">1000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bill Gates</td>
                <td>Founder</td>
                <!-- <td>1000</td> -->
            </tr>
            <tr>
                <td>3</td>
                <td>Bill Gates</td>
                <td>Founder</td>
                <!-- <td>1000</td> -->
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td>3000</td>
            </tr>
        </tfoot>
    </table>
    <p>Заголовок позначається тегом &lt;h1&gt;</p>
</body>

</html>
